[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nubbot77", email = "cyclotron0707@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
   